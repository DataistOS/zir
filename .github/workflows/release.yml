name: Publish Python Package to PyPI

on:
  push:
    tags:
      - 'v*' # Triggers the workflow on new version tags (e.g., v1.0.0)

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    # Configures OIDC permissions required for secure connection to PyPI (Trusted Publishers)
    permissions:
      id-token: write

    steps:
      # Checks out the repository source code into the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Sets up the specified Python version environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Installs and upgrades package building dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      # Builds the source distribution and wheel packages into the dist/ directory
      - name: Build package
        run: |
          python -m build

      # Temporarily disabled: Publishes the built package to PyPI using Trusted Publishers
      # - name: Publish package to PyPI
      #   uses: pypa/gh-action-pypi-publish@release/v1